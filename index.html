<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f6f6" />
  <link rel="icon" href="data:," />
  <title>ID Card</title>
  <link rel="stylesheet" href="styles/landing.css" />
</head>
<body>
  <!-- 首頁只是入口選單，不載入 A-Frame/MindAR，讓手機先快速看到兩個選項。 -->
  <main class="landing">
    <div class="landing-inner">
      <p class="eyebrow">ID CARD · WEBAR</p>
      <h1>一張名片，<br />兩種入口。</h1>
      <p class="landing-lede">收到名片的人看內容；製作名片的人進入工作室。</p>
      <div class="entry-grid">
        <!-- 觀看端必須帶 ?card=...，所以首頁這張卡刻意不可點，避免產生空連結。 -->
        <div class="entry-card entry-card--static">
          <span class="entry-num">01</span>
          <h2>觀看名片</h2>
          <p>請掃名片上的 QR，或使用製作端產生的完整連結。直接開 viewer.html 不會有卡片資料。</p>
        </div>
        <a class="entry-card" href="studio.html">
          <span class="entry-num">02</span>
          <h2>製作名片</h2>
          <p>上傳卡蓋圖案、編輯內容、編譯並發布自己的名片。</p>
        </a>
      </div>
      <p class="landing-note">觀看端需要名片上的卡片連結；直接打開首頁不會有卡片資料。</p>
    </div>
  </main>
</body>
</html>
