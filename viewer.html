<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f6f6" />
  <link rel="icon" href="data:," />
  <title>ID Card · Viewer</title>
  <link rel="stylesheet" href="styles/viewer.css" />
</head>
<body>
  <!--
    觀看端：先顯示普通名片，使用者按「用 AR 看」才啟動相機。
    ?card=cards/<slug>/card.json 是唯一入口；沒有帶參數時會顯示錯誤卡。
  -->
  <main id="viewer">
    <!-- 普通名片頁；空欄位由 js/viewer/app.js 隱藏。 -->
    <section id="viewerProfile" class="viewer-card">
      <p class="viewer-eyebrow">ID CARD</p>
      <h1 id="viewerName">ID Card</h1>
      <p id="viewerTitle" class="viewer-title"></p>
      <p id="viewerCompany" class="viewer-company"></p>
      <ul class="viewer-contact">
        <li id="viewerPhoneItem"><a id="viewerPhone"></a></li>
        <li id="viewerEmailItem"><a id="viewerEmail"></a></li>
        <li id="viewerWebsiteItem"><a id="viewerWebsite" target="_blank" rel="noopener"></a></li>
      </ul>
      <button id="viewerArBtn" class="primary-btn" type="button" disabled>用 AR 看 <span class="arrow" aria-hidden="true">→</span></button>
      <p class="viewer-hint">需要相機權限；建議用手機開啟。看不到 AR 時，名片資訊仍可使用。</p>

      <!--
        聯絡區：名片一打開就顯示（不用先看完 AR），讓對方能立刻存名片或聯絡。
        看完 AR 回到名片頁時，會捲到這一區。
      -->
      <section id="viewerContact" class="viewer-contact-panel" aria-label="聯絡方式">
        <h2 class="viewer-section-title">聯絡我</h2>
        <p class="viewer-section-note">儲存名片或直接從這裡聯絡我。</p>
        <div id="viewerLinks" class="viewer-links"></div>
        <div id="viewerActions" class="viewer-actions">
          <button id="viewerSaveBtn" class="secondary-btn" type="button">儲存名片</button>
          <button id="viewerShareBtn" class="secondary-btn" type="button">分享這張名片</button>
        </div>
        <p id="viewerShareTip" class="viewer-hint" hidden></p>
      </section>
    </section>

    <!-- 讀不到 manifest / 缺 card 參數時的錯誤卡。 -->
    <section id="viewerError" class="viewer-card viewer-error" hidden aria-live="polite">
      <p class="viewer-eyebrow">ID CARD</p>
      <h1>讀不到這張名片</h1>
      <p id="viewerErrorMsg"></p>
      <a class="primary-btn" href="index.html">回首頁</a>
    </section>

    <!-- 相機啟動中的全螢幕 loading；AR ready 或錯誤時由 app.js 隱藏。 -->
    <div id="viewerLoading" class="viewer-loading" hidden role="status" aria-live="polite">
      <div class="compile-orbit" aria-hidden="true"></div>
      <p>正在啟動相機…</p>
    </div>
  </main>

  <noscript>這個觀看頁需要 JavaScript 才能顯示名片與 AR 內容。</noscript>

  <!-- 與 studio.html 相同：A-Frame → MindAR core/bundle → bundle ref → viewer 入口。 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <script src="js/mindar-bundle-ref.js"></script>
  <!-- 雲端名片用：只讀 `get_public_card`，不需要登入。 -->
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/viewer/main.js"></script>
</body>
</html>
